query fetchCollectibles($after: String, $type: CollectibleType!, $onlyLimited: Boolean, $excludePurchased: Boolean) {
  collectibles(first: 24, after: $after, type: $type, visible: true, onlyLimited: $onlyLimited, excludePurchased: $excludePurchased) {
    edges { node { id slug type titles { lang content } price basePrice quantity rating image { original { url } } viewerCollectible { id active } } }
    pageInfo { hasNextPage endCursor }
  }
}
